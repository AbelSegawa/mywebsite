workflows:
  nymala-android:
    name: Nymala Academy Android
    max_build_duration: 60
    environment:
      vars:
        PYTHON_VERSION: 3.10
      flutter: none
      xcode: none
    scripts:
      - name: Install Buildozer
        script: |
          python3 -m pip install buildozer cython
      - name: Build APK
        script: |
          cd $CM_BUILD_DIR
          buildozer -v android debug
    artifacts:
      - $HOME/.buildozer/android/platform/build/*/bin/*.apk
    publishing:
      email:
        recipients:
          - abelsegawa9@gmail.com # change to your email
