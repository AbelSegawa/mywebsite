workflows:
  nymala-android:
    name: Nymala Academy Android
    instance_type: linux
    max_build_duration: 60
    environment:
      vars:
        PYTHON_VERSION: 3.10
    scripts:
      - name: Install Buildozer + deps
        script: |
          python3 -m pip install buildozer cython
          sudo apt-get update
          sudo apt-get install -y zip unzip openjdk-17-jdk
      - name: Build APK
        script: |
          cd $CM_BUILD_DIR
          buildozer -v android debug
    artifacts:
      - $HOME/.buildozer/android/platform/build/*/bin/*.apk
    publishing:
      email:
        recipients:
          - abelsegawa9@gmail.com  # change to your email
